<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <style>
    body { margin:0; background:#F9FAFB; font-family:'Inter',system-ui,sans-serif; color:#1E293B; }
    a { color:#1E3A8A; }
    a:hover { color:#06B6D4; }
    input:focus { outline:2px solid #06B6D4; outline-offset:0; border-color:transparent !important; }
  </style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F9FAFB; padding:24px;">
  <div style="width:100%; max-width:400px; display:flex; flex-direction:column; gap:28px;">

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <svg width="34" height="21" viewBox="0 0 130 80" fill="none"><path d="M14 14 H48 M14 14 V66 M14 40 H38 M14 66 H48" stroke="#1E3A8A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"></path><path d="M100 16 A24 24 0 1 0 100 64" stroke="#1E3A8A" stroke-width="15" stroke-linecap="round" fill="none"></path><circle cx="38" cy="40" r="6" fill="#06B6D4"></circle></svg>
      <div style="font-size:20px; font-weight:700; letter-spacing:-0.01em;">EduCore<span style="font-family:'JetBrains Mono',monospace; color:#06B6D4; font-size:15px; margin-left:1px;">OS</span></div>
    </div>

    <div style="background:#FFFFFF; border:1px solid #E5E7EB; border-radius:8px; padding:28px; box-shadow:0 12px 32px rgba(15,23,42,0.06); display:flex; flex-direction:column; gap:18px;">
      <div>
        <div style="font-size:18px; font-weight:700; margin-bottom:4px;">Sign in</div>
        <div style="font-size:13px; color:#64748B;">Graceland International Academy</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-size:12px; color:#475569; font-weight:500;">Sign in as</label>
        <select onchange="{{ onRoleChange }}" style="width:100%; box-sizing:border-box; padding:9px 12px; font:inherit; font-size:14px; border-radius:6px; border:1px solid #E5E7EB; color:#1E293B; background:#FFFFFF;">
          <option value="ADMIN">Admin</option>
          <option value="ACADEMIC_HEAD">Academic Head</option>
          <option value="STAFF_TEACHER">Teacher</option>
          <option value="STAFF_BURSAR">Bursar</option>
          <option value="STAFF_GENERAL">General Staff</option>
          <option value="APPLICANT">Applicant</option>
        </select>
      </div>

      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-size:12px; color:#475569; font-weight:500;">Email</label>
        <input type="email" placeholder="you@gracelandacademy.edu.ng" style="width:100%; box-sizing:border-box; padding:9px 12px; font:inherit; font-size:14px; border-radius:6px; border:1px solid #E5E7EB; color:#1E293B;"></input>
      </div>

      <div style="display:flex; flex-direction:column; gap:5px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label style="font-size:12px; color:#475569; font-weight:500;">Password</label>
          <a href="#" style="font-size:12px; text-decoration:none;">Forgot password?</a>
        </div>
        <input type="password" placeholder="••••••••" style="width:100%; box-sizing:border-box; padding:9px 12px; font:inherit; font-size:14px; border-radius:6px; border:1px solid #E5E7EB; color:#1E293B;"></input>
      </div>

      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#475569; cursor:pointer;">
        <input type="checkbox" style="accent-color:#1E3A8A; width:15px; height:15px;"></input>
        Keep me signed in on this device
      </label>

      <button onclick="{{ onSignIn }}" style="width:100%; font:inherit; font-size:14px; font-weight:600; padding:11px; border-radius:6px; border:none; background:#1E3A8A; color:#fff; cursor:pointer;">Sign in to {{ activeRoleLabel }} workspace</button>

      <div style="text-align:center; font-size:12px; color:#94A3B8;">Don't have an account? Contact your school administrator.</div>
    </div>

    <div style="text-align:center; font-size:12px; color:#94A3B8;">© 2026 EduCoreOS · Privacy · Terms</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const ROLE_LABELS = {
  ADMIN: 'Admin',
  ACADEMIC_HEAD: 'Academic Head',
  STAFF_TEACHER: 'Teacher',
  STAFF_BURSAR: 'Bursar',
  STAFF_GENERAL: 'General Staff',
  APPLICANT: 'Applicant',
};

class Component extends DCLogic {
  state = { role: 'ADMIN' };

  renderVals() {
    const { role } = this.state;
    return {
      activeRoleLabel: ROLE_LABELS[role],
      onRoleChange: (e) => this.setState({ role: e.target.value }),
      onSignIn: () => {},
    };
  }
}

</script>
</body>
</html>
